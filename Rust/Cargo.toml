[workspace]
resolver = "2"
members = ["crates/parchley-core", "crates/parchley-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
pdf-inspector = { version = "1.17.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
