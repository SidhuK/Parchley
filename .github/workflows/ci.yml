name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.95.0
  XCODE_VERSION: 26.6

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
      - run: cargo fmt --manifest-path Rust/Cargo.toml --all -- --check
      - run: Scripts/fetch-ocr-assets.sh
      - run: cargo test --manifest-path Rust/Cargo.toml --locked
      - run: cargo test --manifest-path Rust/Cargo.toml --locked --features parchley-core/ocr

  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: xcodebuild -version
      - run: swift test --package-path Packages/ParchleyDomain
      - run: swift test --package-path Packages/ParchleyMarkdown
      - run: swift test --package-path Packages/ParchleyEngine
      - run: xcodebuild -project Parchley.xcodeproj -scheme Parchley -sdk macosx -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
